name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kadrovik_test
          POSTGRES_USER: kadrovik
          POSTGRES_PASSWORD: kadrovik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kadrovik -d kadrovik_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://kadrovik:kadrovik@localhost:5432/kadrovik_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: postgresql+psycopg://kadrovik:kadrovik@localhost:5432/kadrovik_test
        run: alembic upgrade head && alembic check

  frontend:
    name: frontend · typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    name: docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: kadrovik-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: kadrovik-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: soffice image
        uses: docker/build-push-action@v6
        with:
          context: docker/soffice
          push: false
          tags: kadrovik-soffice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
